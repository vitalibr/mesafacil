<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MesaFácil mudou de endereço</title>
    <link rel="canonical" href="https://mesafacil.vmgarage.com.br/" />
    <meta http-equiv="refresh" content="3; url=https://mesafacil.vmgarage.com.br/" />
    <script>
      // Leva para o mesmo caminho no endereço novo e, se houver projeto salvo neste endereço, leva junto
      // no fragmento (#migrar=...), que não é enviado a nenhum servidor.
      ;(function () {
        var path = location.pathname.replace(/^\/mesafacil/, '') || '/'
        var dest = 'https://mesafacil.vmgarage.com.br' + path + location.search
        try {
          var keys = ['mesafacil:projeto', 'mesafacil:idioma', 'mesafacil:tutorial', 'mesafacil:criador']
          var data = {}
          var any = false
          for (var i = 0; i < keys.length; i++) {
            var v = localStorage.getItem(keys[i])
            if (v !== null) {
              data[keys[i]] = v
              any = true
            }
          }
          // só a página do app (/) lê o #migrar=; termos e outras páginas seguem sem ele
          if (any && path === '/') {
            var bytes = new TextEncoder().encode(JSON.stringify(data))
            var bin = ''
            for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j])
            dest += '#migrar=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
          } else {
            dest += location.hash
          }
        } catch (e) {
          dest += location.hash
        }
        location.replace(dest)
      })()
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #111827; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 16px; }
      a { color: #2563eb; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>O MesaFácil mudou para <a href="https://mesafacil.vmgarage.com.br/">mesafacil.vmgarage.com.br</a>.<br /><span lang="en">MesaFácil has moved to the address above.</span></p>
  </body>
</html>
